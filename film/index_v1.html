<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3f31">
  <meta name="description" content="Презентационный фильм об игровом тренажёре Spotlight Jungle для повторения английского языка за 2 класс.">
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Spotlight Jungle — игровой тренажёр">
  <meta property="og:description" content="Посмотрите, как ребёнок повторяет английский, выполняет задания, получает детали и собирает команду роботов.">
  <meta property="og:image" content="https://podsoblyaeva-sv.github.io/spotlight-jungle-2-class/film/poster-v14.png">
  <meta property="og:video" content="https://podsoblyaeva-sv.github.io/spotlight-jungle-2-class/film/spotlight-jungle-presentation-v14.mp4">
  <meta property="og:video:type" content="video/mp4">
  <title>Spotlight Jungle — презентация игры</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07372b;
      color: #fffdf1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 211, 87, .18), transparent 34rem),
        linear-gradient(160deg, #0d5d42 0%, #07372b 55%, #05281f 100%);
    }

    .page {
      width: min(100%, 1280px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: grid;
      align-content: center;
      gap: 16px;
    }

    .intro { text-align: center; }

    h1 {
      margin: 0 0 6px;
      color: #ffd357;
      font-size: clamp(1.45rem, 4.5vw, 2.6rem);
      line-height: 1.1;
    }

    .intro p {
      max-width: 820px;
      margin: 0 auto;
      color: #e7f5ed;
      font-size: clamp(.95rem, 2.6vw, 1.18rem);
      line-height: 1.45;
    }

    .player-card {
      overflow: hidden;
      border: 2px solid rgba(255, 211, 87, .72);
      border-radius: clamp(14px, 3vw, 26px);
      background: #001c16;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    video {
      display: block;
      width: 100%;
      max-height: min(72svh, 760px);
      aspect-ratio: 16 / 9;
      background: #001c16;
      object-fit: contain;
    }

    .controls {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: rgba(6, 55, 43, .96);
    }

    button, a {
      min-height: 48px;
      border-radius: 14px;
      font: inherit;
      font-weight: 750;
    }

    button {
      border: 0;
      padding: 0 20px;
      background: #ffd357;
      color: #173b31;
      cursor: pointer;
    }

    .game-link {
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, .65);
      color: #fffdf1;
      text-decoration: none;
    }

    .phone-tip {
      margin: 0;
      text-align: center;
      color: #cfe7dc;
      font-size: .95rem;
    }

    @media (max-width: 620px) {
      .page { align-content: start; gap: 12px; }
      .controls { grid-template-columns: 1fr; }
      video { max-height: 68svh; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .page { padding: 8px; gap: 8px; }
      .intro p, .phone-tip { display: none; }
      h1 { font-size: 1.15rem; margin: 0; }
      video { max-height: calc(100svh - 16px); }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Spotlight Jungle</h1>
      <p>Фильм об игровом тренажёре для повторения английского языка за 2 класс.</p>
    </header>

    <section class="player-card" aria-label="Презентация игрового тренажёра">
      <video id="film" controls playsinline preload="metadata" poster="poster-v14.png">
        <source src="spotlight-jungle-presentation-v14.mp4" type="video/mp4">
        Ваш браузер не поддерживает просмотр видео.
      </video>
      <div class="controls">
        <button id="fullscreen" type="button">⛶ Смотреть на весь экран</button>
        <a class="game-link" href="../">Открыть игру</a>
      </div>
    </section>

    <p class="phone-tip">На телефоне нажмите «на весь экран» и поверните его горизонтально — подписи станут крупнее.</p>
  </main>

  <script>
    const film = document.querySelector('#film');
    document.querySelector('#fullscreen').addEventListener('click', async () => {
      try {
        if (film.webkitEnterFullscreen) {
          film.webkitEnterFullscreen();
        } else if (film.requestFullscreen) {
          await film.requestFullscreen();
        }
        await film.play();
      } catch (error) {
        film.controls = true;
        await film.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
